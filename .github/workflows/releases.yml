name: release

run-name: releasing gcc

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write


env:
  release_version: 'v0.0.1'
  gcc_version: '14.1.0'
  workdir: '/tmp/paranbuild'
  releasedir: '/tmp/paranbuild/release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: create workdir
        run: |
          mkdir -p ${{ env.workdir }}
          mkdir -p ${{ env.releasedir }}

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libmpc-dev libmpfr-dev texinfo flex bison


      - name: Build GCC paran package
        run: |
          # Use the repo BUILD helper to download, build and produce a paranpackage
          # The BUILD script will stage /usr into pkg/gcc/files/ and call the
          # repository packer to produce a complete paranpackage tarball.
          cd ${{ github.workspace }}
          ./pkg/gcc/BUILD "${{ env.workdir }}" "${{ env.gcc_version }}" "${{ env.release_version }}"

      - name: Package paranpackage
        run: |
          # Create a full paranpackage tarball (includes MANIFEST, scripts, helpers, files/)
          cd ${{ github.workspace }}
          OUT_TAR="${{ env.releasedir }}/gcc-paranpackage-${{ env.release_version }}.tar.gz"
          ./scripts/pack-paranpackage.sh pkg/gcc "$OUT_TAR"
          echo "Created paranpackage: $OUT_TAR"

      - name: Generate Changelog
        run: echo "# paran-based ${{ env.release_version }}" > ${{ env.releasedir }}/paran-based-CHANGELOG.txt

      - name: Build
        run: echo ${{ github.sha }} > ${{ env.releasedir }}/Release.txt

      - name: Test
        run: cat ${{ env.releasedir }}/Release.txt
        
      - name: List Files
        run: ls ${{ env.releasedir }}  

      - name: Release
        uses: softprops/action-gh-release@v2 # https://github.com/softprops/action-gh-release
        with:
          name: paran-based ${{ env.release_version }}
          body_path: ${{ env.releasedir }}/paran-based-CHANGELOG.txt
          tag_name: ${{ env.release_version }}
          fail_on_unmatched_files: true
          files: |
            /tmp/paranbuild/release/*
            