name: release

run-name: releasing packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      package_input:
        description: 'Optional package name to build (e.g. "acl"). If empty, build all packages listed in pkg/pkg_list.'
        required: false

permissions:
  contents: write

env:
  release_version: 'v0.0.1'
  workdir: '/tmp/paranbuild'
  releasedir: '/tmp/paranbuild/release'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create workdir
        run: |
          mkdir -p ${{ env.workdir }}
          mkdir -p ${{ env.releasedir }}

      - name: Make package matrix
        id: make-matrix
        env:
          PACKAGE_INPUT: ${{ github.event.inputs.package_input }}
        run: |
          set -euo pipefail
          python3 ./scripts/make-matrix.py > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> $GITHUB_OUTPUT

  build-and-release:
    needs: generate-matrix
    runs-on: ubuntu-latest
    name: Build packages (sequential) and create single Release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libmpc-dev libmpfr-dev texinfo flex bison jq

      - name: Create workdir
        run: |
          mkdir -p ${{ env.workdir }}
          mkdir -p ${{ env.releasedir }}

      - name: Prepare package list
        id: prepare
        run: |
          set -euo pipefail
          echo "${{ needs.generate-matrix.outputs.matrix }}" > /tmp/matrix.json
          echo "matrix_file=/tmp/matrix.json" >> $GITHUB_OUTPUT

      - name: Build packages sequentially
        id: build-loop
        run: |
          set -euo pipefail
          mkdir -p "${{ env.workdir }}" "${{ env.releasedir }}"
          MATRIX=/tmp/matrix.json
          if [ ! -f "$MATRIX" ]; then
            echo "matrix missing, nothing to build"
            echo "artifacts_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          total=$(jq 'length' "$MATRIX")
          if [ "$total" -eq 0 ]; then
            echo "No packages to build"
            echo "artifacts_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          artifacts=()
          for i in $(seq 0 $((total - 1))); do
            name=$(jq -r ".[$i].name" "$MATRIX")
            src=$(jq -r ".[$i].src" "$MATRIX")
            echo "--- Building $name (src: $src) ---"
            if [ ! -d "pkg/$name" ]; then
              echo "pkg/$name not found, skipping"
              continue
            fi
            if [ -x "pkg/$name/BUILD" ]; then
              ./pkg/$name/BUILD "${{ env.workdir }}" "$src" "${{ env.release_version }}"
            else
              echo "No BUILD script for pkg/$name, skipping"
              continue
            fi
            OUT_TAR="${{ env.releasedir }}/$name-${{ env.release_version }}.tar.gz"
            ./scripts/pack-paranpackage.sh "pkg/$name" "$OUT_TAR"
            artifacts+=("$OUT_TAR")
            echo "Created $OUT_TAR"
          done
          count=${#artifacts[@]}
          echo "artifacts_count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -gt 0 ]; then
            printf '%s\n' "${artifacts[@]}" > /tmp/artifacts.list || true
          fi
          ls -la "${{ env.releasedir }}" || true

      - name: Generate aggregated changelog
        if: ${{ steps.build-loop.outputs.artifacts_count != '0' }}
        run: |
          set -euo pipefail
          OUT="${{ env.releasedir }}/RELEASE-CHANGELOG.md"
          echo "# paran-based ${{ env.release_version }}" > "$OUT"
          echo "" >> "$OUT"
          echo "Built packages:" >> "$OUT"
          if [ -f /tmp/artifacts.list ]; then
            while IFS= read -r a; do
              bn=$(basename "$a")
              pkg=$(echo "$bn" | sed -E 's/-'"${{ env.release_version }}"'\.tar\.gz$//')
              echo "- $pkg" >> "$OUT"
              if [ -f "${{ env.releasedir }}/$pkg-CHANGELOG.txt" ]; then
                echo "" >> "$OUT"
                echo "## $pkg changelog" >> "$OUT"
                cat "${{ env.releasedir }}/$pkg-CHANGELOG.txt" >> "$OUT"
                echo "" >> "$OUT"
              fi
            done < /tmp/artifacts.list
          else
            for f in "${{ env.releasedir }}"/*-CHANGELOG.txt; do
              [ -e "$f" ] || continue
              pkg=$(basename "$f" | sed -E 's/-CHANGELOG.txt$//')
              echo "- $pkg" >> "$OUT"
              echo "" >> "$OUT"
              echo "## $pkg changelog" >> "$OUT"
              cat "$f" >> "$OUT"
              echo "" >> "$OUT"
            done
          fi

      - name: Create Release (single)
        if: ${{ steps.build-loop.outputs.artifacts_count != '0' }}
        uses: softprops/action-gh-release@v2
        with:
          name: "paran-based ${{ env.release_version }}"
          body_path: "${{ env.releasedir }}/RELEASE-CHANGELOG.md"
          tag_name: "${{ env.release_version }}"
          fail_on_unmatched_files: true
          files: |
            ${{ env.releasedir }}/*
            /tmp/paranbuild/release/*
