name: release

run-name: releasing packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      package_input:
        description: 'Optional package name to build (e.g. "acl"). If empty, build all packages listed in pkg/pkg_list.'
        required: false

permissions:
  contents: write

env:
  release_version: 'v0.0.1'
  workdir: '/tmp/paranbuild'
  releasedir: '/tmp/paranbuild/release'

jobs:
  create-release-init:
    runs-on: ubuntu-latest
    name: Initialize release (draft)
    outputs:
      release_version: ${{ steps.set-vars.outputs.release_version }}
      workdir: ${{ steps.set-vars.outputs.workdir }}
      releasedir: ${{ steps.set-vars.outputs.releasedir }}
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.release_version }}"
          name: "paran-based ${{ env.release_version }}"
          body: "Automated draft release; package jobs will attach assets and append changelogs."
          draft: true
      - name: Set release outputs
        id: set-vars
        run: |
          echo "release_version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "workdir=/tmp/paranbuild" >> $GITHUB_OUTPUT
          echo "releasedir=/tmp/paranbuild/release" >> $GITHUB_OUTPUT

  build-attr:
    needs: create-release-init
    uses: ./.github/workflows/build-package.yml
    with:
      package: attr
      release_version: ${{ needs.create-release-init.outputs.release_version }}
      workdir: ${{ needs.create-release-init.outputs.workdir }}
      releasedir: ${{ needs.create-release-init.outputs.releasedir }}

  build-acl:
    needs: build-attr
    uses: ./.github/workflows/build-package.yml
    with:
      package: acl
      release_version: ${{ needs.create-release-init.outputs.release_version }}
      workdir: ${{ needs.create-release-init.outputs.workdir }}
      releasedir: ${{ needs.create-release-init.outputs.releasedir }}

  build-gcc:
    needs: build-acl
    uses: ./.github/workflows/build-package.yml
    with:
      package: gcc
      release_version: ${{ needs.create-release-init.outputs.release_version }}
      workdir: ${{ needs.create-release-init.outputs.workdir }}
      releasedir: ${{ needs.create-release-init.outputs.releasedir }}

  create-release:
    needs: [build-attr, build-acl, build-gcc]
    runs-on: ubuntu-latest
    name: Publish release
    steps:
      - name: Publish release (softprops)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.release_version }}"
          name: "paran-based ${{ env.release_version }}"
          draft: false
          fail_on_unmatched_files: false
            